name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected instead, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro, including the tool call input if relevant (redact any API keys).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-critic-loop version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 20.11.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Which MCP client/host you're running this through (Claude Code, Claude Desktop, etc.)
